apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipd-report
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: BETTER_AUTH_URL
              value: https://ipd.pskwr.com
            - name: BETTER_AUTH_TRUSTED_ORIGINS
              value: https://ipd.pskwr.com
            - name: LINE_CHANNEL_ACCESS_TOKEN_CONFIGURED
              value: "true"
