# Stage 1 creates the Infisical resource and namespace before the workload
# overlay is synced. Values are stored only in Infisical at /ipd/.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ipd-report-env
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: ipd-ye-g4
        envSlug: prod
        secretsPath: /
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: monitoring
  managedSecretReference:
    secretName: ipd-report-env
    secretNamespace: ipd-report
    creationPolicy: Owner
