apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ipd-report
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ipd.pskwr.com
        - ipd.pingsunn.com
      secretName: ipd-report-tls
  rules:
    - host: ipd.pskwr.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ipd-report
                port:
                  name: http
    - host: ipd.pingsunn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ipd-report
                port:
                  name: http
