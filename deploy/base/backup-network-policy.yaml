apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ipd-report-backup-network
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ipd-report-backup
  policyTypes:
    - Ingress
    - Egress
  # No ingress is permitted for a one-shot backup job.
  ingress: []
  egress:
    # CoreDNS is the only in-cluster dependency.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # S3-compatible storage over HTTPS and the source PostgreSQL endpoint.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
