apiVersion: batch/v1
kind: Job
metadata:
  name: ipd-report-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ipd-report-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: ghcr.io/pingsunn/ipd-report-ops@sha256:REPLACE_WITH_OPS_DIGEST
          imagePullPolicy: IfNotPresent
          command:
            - bun
            - run
            - db:deploy
          env:
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: ipd-report-env
                  key: DIRECT_URL
