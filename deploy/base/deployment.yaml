apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipd-report
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ipd-report
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ipd-report
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/pingsunn/ipd-report@sha256:REPLACE_WITH_APP_DIGEST
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 40000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ipd-report-env
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ipd-report-env
                  key: BETTER_AUTH_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ipd-report-env
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ipd-report-env
                  key: GOOGLE_CLIENT_SECRET
            - name: AUTH_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ipd-report-env
                  key: AUTH_BOOTSTRAP_EMAIL
            # The web process needs only a non-secret readiness indicator. The
            # actual token is mounted into the isolated LINE worker below.
            - name: LINE_CHANNEL_ACCESS_TOKEN_CONFIGURED
              value: "false"
            - name: LINE_CHANNEL_SECRET
              valueFrom:
                secretKeyRef:
                  name: ipd-report-env
                  key: LINE_CHANNEL_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
