# Secret values live only in Infisical. The operator materializes the
# Kubernetes Secret consumed by the web, worker, and migration Job.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ipd-report-env
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: ipd-ye-g4
        envSlug: prod
        secretsPath: /
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: monitoring
  managedSecretReference:
    secretName: ipd-report-env
    secretNamespace: ipd-report
    creationPolicy: Owner
