name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ipd:ci-password@127.0.0.1:5432/ipd_ci
      DIRECT_URL: postgresql://ipd:ci-password@127.0.0.1:5432/ipd_ci
      LINE_TEST_DATABASE_URL: postgresql://ipd:ci-password@127.0.0.1:5432/ipd_ci
      BETTER_AUTH_SECRET: ci-build-secret-012345678901234567890123
      BETTER_AUTH_URL: http://localhost:40000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:40000
      NEXT_PUBLIC_APP_URL: http://localhost:40000
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ipd
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ipd_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ipd -d ipd_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:deploy
      - run: bun run typecheck
      - run: bunx tsc -p tsconfig.backup.json --noEmit
      - run: bun run test
      - run: bun run build
      - name: Build backup image for verification
        run: docker build --target backup --tag ipd-report-backup:ci .
      - name: Smoke-test backup image hardening
        shell: bash
        run: |
          test "$(docker image inspect ipd-report-backup:ci --format '{{.Config.User}}')" = "1000:1000"
          set +e
          output="$(docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev ipd-report-backup:ci 2>&1)"
          status="$?"
          set -e
          test "$status" -ne 0
          grep -F 'BACKUP_ENCRYPTION_KEY is required' <<< "$output"
      - name: Validate backup alert rules
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/deploy/monitoring:/rules:ro"
          --entrypoint promtool
          prom/prometheus:v3.8.0
          test rules /rules/backup-promtool.test.yml

  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      APP_IMAGE: ghcr.io/pingsunn/ipd-report
      OPS_IMAGE: ghcr.io/pingsunn/ipd-report-ops
      BACKUP_IMAGE: ghcr.io/pingsunn/ipd-report-backup
      IMAGE_TAG: sha-${{ github.sha }}
      NEXT_PUBLIC_APP_URL: https://ipd.pingsunn.com
    steps:
      - name: Check out verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push application image
        id: app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: runner
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha,scope=ipd-report-app
          cache-to: type=gha,mode=max,scope=ipd-report-app
      - name: Build and push operations image
        id: ops
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: ops
          push: true
          tags: ${{ env.OPS_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ipd-report-ops
          cache-to: type=gha,mode=max,scope=ipd-report-ops
      - name: Build and push backup image
        id: backup
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: backup
          push: true
          tags: ${{ env.BACKUP_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ipd-report-backup
          cache-to: type=gha,mode=max,scope=ipd-report-backup
      - name: Record image references and digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          OPS_DIGEST: ${{ steps.ops.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
        run: |
          {
            echo '## Published images'
            echo
            printf -- '- Application: `%s:%s`\n  - Digest: `%s`\n' "$APP_IMAGE" "$IMAGE_TAG" "$APP_DIGEST"
            printf -- '- Operations: `%s:%s`\n  - Digest: `%s`\n' "$OPS_IMAGE" "$IMAGE_TAG" "$OPS_DIGEST"
            printf -- '- Backup: `%s:%s`\n  - Digest: `%s`\n' "$BACKUP_IMAGE" "$IMAGE_TAG" "$BACKUP_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
